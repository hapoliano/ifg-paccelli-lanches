<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paccelli Lanches - Entrar</title>
  <link rel="stylesheet" href="login.css">
  <script src="pacceli.js"></script>
</head>
<body>

<div class="login-container">
  <!-- Cabeçalho com logo -->
  <div class="header">
    <div class="logo">🍔</div>
    <h1>Paccelli Lanches</h1>
    <p>Peça agora e aproveite!</p>
  </div>

  <!-- Formulário -->
  <div class="form-container">
    <form id="loginForm">
      <div class="input-group">
        <label for="email">E-mail ou telefone</label>
        <input type="text" id="email" placeholder="Digite seu e-mail ou telefone" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <div class="options">
        <div class="checkbox">
          <input type="checkbox" id="lembrar">
          <label for="lembrar">Lembrar de mim</label>
        </div>
        <a href="#" class="forgot">Esqueci a senha</a>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="register">
      Não tem conta? <a href="cadastro">Cadastre-se agora</a>
    </div>
  </div>

  <div class="footer">
    © 2026 Paccelli Lanches • Todos os direitos reservados
  </div>
</div>



</body>
</html>
